# =====================================================================
# JABBERWOCKY TOOLHEAD SYSTEM — PRODUCTION HARDWARE & STEPPER TUNING
# VERSION: 1.0.0
# Location: ~/printer_data/config/jw_toolhead/jwt_hardware.cfg
# =====================================================================

[extruder]
# --- KINEMATIC RESOLUTION CONSTANTS ---
# Calculated 44:17 reduction loop matrix yields 1473.24 steps/mm resolution
rotation_distance: 22.6789
gear_ratio: 44:17
microsteps: 32
full_steps_per_rotation: 200

# --- PHYSICAL PATH ALLOCATIONS (Example Nitehawk Assignments) ---
step_pin: nhk:gpio23
dir_pin: !nhk:gpio24
enable_pin: !nhk:gpio25
nozzle_diameter: 0.400
filament_diameter: 1.750

# --- HEATER & THERMISTOR SAFETY BOUNDS ---
heater_pin: nhk:gpio9
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:gpio29
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
min_extrude_temp: 150 # Absolute minimum glass-transition audit floor

# ---------------------------------------------------------------------
# 🎛️ LOW-LEVEL SILICON TELEMETRY OVER UART (CANE REGISTRY GATE)
# ---------------------------------------------------------------------

[tmc2209 extruder]
uart_pin: nhk:gpio28
interpolate: False
run_current: 0.500
hold_current: 0.100
sense_resistor: 0.110
# Our fine-tuned 7.0 mm/s hybrid crossover gate configuration parameters
stealthchop_threshold: 7.0
