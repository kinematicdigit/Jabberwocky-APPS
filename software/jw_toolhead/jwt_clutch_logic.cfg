# =====================================================================
# JABBERWOCKY APPS — CONCISE LIFE-CYCLE WELCOME LAYOUT & HELP PLATFORM
# REVISION: v1.2.1 [Streamlined Console Engine]
# Location: jabberwocky_dist/jwt_clutch_logic.cfg
# =====================================================================

[respond]

[delayed_gcode _JABBERWOCKY_WELCOME_TRIGGER]
initial_duration: 2.0
gcode:
    JABBERWOCKY_WELCOME

# ---------------------------------------------------------------------
# 🐉 CONCISE CONSOLE OPERATIONS
# ---------------------------------------------------------------------

[gcode_macro JABBERWOCKY_WELCOME]
description: Emits a concise, single-column system status card to the console.
gcode:
    M118 ─── JABBERWOCKY PRINT PROTECTION SUITE ───
    M118   • STATUS     : SYSTEM READY / ARMED
    M118   • CORE LAYER : v1.1.0 (CANE Engine Active)
    M118   • OVERRIDES  : ASC Software Clutch Armed
    M118   ➔ Type 'JABBERWOCKY_HELP' for macro index.
    M118 ──────────────────────────────────────────

[gcode_macro JABBERWOCKY_HELP]
description: Displays the terminal index mapping all active software triggers.
gcode:
    M118 ═══════════════ JABBERWOCKY COMMAND DIRECTORY ═══════════════
    M118  👉 USER CONTROLS:
    M118     • JABBERWOCKY_DASHBOARD       ➔ Pulls dynamic telemetry matrix.
    M118     • JABBERWOCKY_HELP            ➔ Prints this command directory.
    M118  👉 CALIBRATION UTILITIES:
    M118     • ASC_RUN_GEAR_ALIGNMENT_AUDIT ➔ Starts 44:17 real-time oscillation.
    M118     • ASC_SAVE_BUILD_CALIBRATION  ➔ Locks parallel pitch center.
    M118     • JWT_EMERGENCY_CLUTCH_RESET  ➔ Clears stress logs & speed cap factors.
    M118 ═════════════════════════════════════════════════════════════

[gcode_macro JABBERWOCKY_DASHBOARD]
description: Queries active real-time status registers across low-level silicon layers.
gcode:
    {% set V = printer["gcode_macro _ASC_SETUP_VARIABLES"] %}
    M118 📡 [TELEMETRY REGISTER REPORT]
    M118   • Protection Mode : Watchdog Active
    M118   • Gearing Profile : 44:17 Reduction Matrix
    M118   • Saved Steps     : F_PWM={V.saved_forward_pwm} | R_PWM={V.saved_reverse_pwm}
    JWT_CLUTCH_STATUS
