# =====================================================================
# JABBERWOCKY TOOLHEAD SYSTEM — ASC USER SETUP & INTERACTIVE CONTROLS
# VERSION: 1.1.1 [Patch_E_Verified]
# Location: software/jw_toolhead/jwt_clutch_logic.cfg
# =====================================================================

[gcode_macro _DASHBOARD_UI_GROUPING]
description: Native Mainsail card-group metadata binder.
variable_macro_group: "🦾 JABBERWOCKY CONTROLS"
variable_macros: "JABBERWOCKY_DASHBOARD", "ASC_RUN_GEAR_ALIGNMENT_AUDIT", "ASC_SAVE_BUILD_CALIBRATION", "JWT_EMERGENCY_CLUTCH_RESET"
gcode:

[include jwt_hardware.cfg]

[gcode_macro _ASC_SETUP_VARIABLES]
description: Configuration memory vault for the user bring-up wizard
variable_wizard_active: 0
variable_saved_forward_pwm: 27
variable_saved_reverse_pwm: 27
gcode:

# ---------------------------------------------------------------------
# 🎛️ USER DASHBOARD INTERACTIVE COMMAND ACTIONS
# ---------------------------------------------------------------------

[gcode_macro ASC_RUN_GEAR_ALIGNMENT_AUDIT]
description: Runs the interactive, two-directional cold-build alignment verification pass straight through Mainsail.
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_respond_info("❌ ASC ERROR: Cannot run assembly wizard while an active print job is executing!")}
    {% else %}
        M118 🔍 ASC: Preparing toolhead for real-time 44:17 gearing alignment audit...
        # 🦾 CORRECTED: Change configuration field to native Trinamic chip register field name
        # Setting TPWMTHRS to maximum (0xfffff / 1048575) forces the driver into StealthChop continuously for the test pass.
        SET_TMC_FIELD STEPPER=extruder FIELD=TPWMTHRS VALUE=1048575
        M400
        ASC_INSTALL_WIZARD
    {% endif %}

[gcode_macro ASC_SAVE_BUILD_CALIBRATION]
description: Safely halts real-time motor oscillation and restores production hybrid torque settings.
gcode:
    ASC_SAVE_BUILD
    M400
    # 🦾 CORRECTED: Shifting TPWMTHRS back to 0 forces the driver to run safely in high-torque SpreadCycle mode for production printing.
    SET_TMC_FIELD STEPPER=extruder FIELD=TPWMTHRS VALUE=0
    M400
    M118 ✅ ASC: High-torque production torque profile successfully restored.

[gcode_macro JWT_EMERGENCY_CLUTCH_RESET]
description: Clears structural stress logs and restores print flow metrics back to 100%
gcode:
    {action_respond_info("🔄 JWT: Clearing mechanical stress registers... Restoring velocity planners.")}
    M220 S100 
    SET_TMC_FIELD STEPPER=extruder FIELD=TPWMTHRS VALUE=0
    M400
    {action_respond_info("✅ JWT SUCCESS: Extruder guard armed. Ready for production.")}
