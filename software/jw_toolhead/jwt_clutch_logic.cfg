# =====================================================================
# JABBERWOCKY APPS — LIFECYCLE WELCOME LAYOUT & HELP PLATFORM
# REVISION: v1.2.5 [Load-Order Sequence Restructured]
# Location: jabberwocky_dist/jwt_clutch_logic.cfg
# =====================================================================

[respond]

# Hook the Klipper boot sequence timeline to fire the concise greeting block
[delayed_gcode _JABBERWOCKY_WELCOME_TRIGGER]
initial_duration: 3.0
gcode:
    JABBERWOCKY_WELCOME

# Absolute local include paths targeting the distribution files
[include ./jwt_hardware.cfg]
[include ./jwt_calibration_profiles.cfg]

[gcode_macro _ASC_SETUP_VARIABLES]
description: Configuration memory vault for the user bring-up wizard
variable_wizard_active: 0
variable_saved_forward_pwm: 27
variable_saved_reverse_pwm: 27
gcode:

# ---------------------------------------------------------------------
# 🐉 USER INTERACTIVE CONSOLE ACTIONS
# ---------------------------------------------------------------------

[gcode_macro JABBERWOCKY_WELCOME]
description: Forces a clean system status card featured with a clean one-line dragon badge.
gcode:
    {action_respond_info(
        "─── 🐉 JABBERWOCKY PRINT PROTECTION SUITE ───\n"
        "  • STATUS     : SYSTEM READY / ARMED\n"
        "  • CORE LAYER : v1.1.0 (CANE Engine Active)\n"
        "  • OVERRIDES  : ASC Software Clutch Armed\n"
        "  ➔ Type 'JABBERWOCKY_HELP' for macro index.\n"
        "──────────────────────────────────────────"
    )}

[gcode_macro JABBERWOCKY_HELP]
description: Displays the terminal index mapping all active software triggers.
gcode:
    {action_respond_info(
        "═══════════════ JABBERWOCKY COMMAND DIRECTORY ═══════════════\n"
        "👉 USER CONTROLS:\n"
        "   • JABBERWOCKY_DASHBOARD       ➔ Pulls dynamic telemetry matrix.\n"
        "   • JABBERWOCKY_HELP            ➔ Prints this command directory.\n"
        "👉 CALIBRATION UTILITIES:\n"
        "   • ASC_RUN_GEAR_ALIGNMENT_AUDIT ➔ Starts 44:17 real-time oscillation.\n"
        "   • ASC_SAVE_BUILD_CALIBRATION  ➔ Locks parallel pitch center.\n"
        "   • JWT_EMERGENCY_CLUTCH_RESET  ➔ Clears stress logs & speed factors.\n"
        "═════════════════════════════════════════════════════════════"
    )}

[gcode_macro JABBERWOCKY_DASHBOARD]
description: Queries active real-time status registers across low-level silicon layers.
gcode:
    {% set V = printer["gcode_macro _ASC_SETUP_VARIABLES"] %}
    {action_respond_info(
        "📡 [TELEMETRY REGISTER REPORT]\n"
        "  • Protection Mode : Watchdog Active\n"
        "  • Gearing Profile : 44:17 Reduction Matrix\n"
        "  • Saved Steps     : F_PWM=" ~ V.saved_forward_pwm|string ~ " | R_PWM=" ~ V.saved_reverse_pwm|string
    )}
    JWT_CLUTCH_STATUS

[gcode_macro ASC_RUN_GEAR_ALIGNMENT_AUDIT]
description: Initializes real-time oscillation sweeps to track parallel mesh limits.
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_respond_info("❌ ASC ERROR: Cannot run audit while an active print job is executing!")}
    {% else %}
        M118 🔍 ASC: Preparing toolhead for real-time 44:17 gearing alignment audit...
        SET_TMC_FIELD STEPPER=extruder FIELD=TPWMTHRS VALUE=1048575
        M400
        ASC_INSTALL_WIZARD
    {% endif %}

[gcode_macro ASC_SAVE_BUILD_CALIBRATION]
description: Safely halts real-time motor oscillation and restores production torque settings.
gcode:
    ASC_SAVE_BUILD
    M400
    SET_TMC_FIELD STEPPER=extruder FIELD=TPWMTHRS VALUE=0
    M400
    M118 ✅ ASC: High-torque production profile successfully restored.

[gcode_macro JWT_EMERGENCY_CLUTCH_RESET]
description: Clears structural stress logs and restores print flow metrics back to 100%.
gcode:
    {action_respond_info("🔄 JWT: Clearing mechanical stress registers... Restoring velocity planners.")}
    M220 S100 
    SET_TMC_FIELD STEPPER=extruder FIELD=TPWMTHRS VALUE=0
    M400
    {action_respond_info("✅ JWT SUCCESS: Extruder guard armed. Ready for production.")}

# =====================================================================
# 🦾 HARDWARE ECOSYSTEM ACTIVATION BOUNDARY
# =====================================================================
# Positioned securely at the absolute bottom of the configuration file.
[jwt_assembly_wizard]
