# =====================================================================
# JABBERWOCKY TOOLHEAD SYSTEM — ASYNCHRONOUS ENGINE OVERLAYS
# VERSION: 1.0.1 [No-Duplicate Fix]
# Location: software/jw_toolhead/jwt_hardware.cfg
# =====================================================================

# 🦾 SOFTWARE OVERLAYS ON EXISTING EXTRUDER PROFILE
# Your primary toolboard file maintains sole ownership of your physical pins.
# We define only your high-performance kinematics calculations here to
# prevent double-allocation faults while keeping your parameters intact.
[extruder]
rotation_distance: 22.6789
gear_ratio: 44:17
microsteps: 32
full_steps_per_rotation: 200
min_extrude_temp: 150 # Absolute minimum glass-transition floor for CANE telemetry

# 🎛️ LOW-LEVEL SILICON TELEMETRY OVER UART (CANE REGISTRY GATE)
# Applies your custom pinout tracking variables and the 7.0mm/s hybrid 
# crossover gate right on top of your existing stepper driver profile.
[tmc2209 extruder]
uart_pin: nhk:gpio0   # ◄── ALIGNED TO PHYSICAL NATIVE BOARD TO PREVENT UART LOSS
interpolate: False
run_current: 0.500
hold_current: 0.100
sense_resistor: 0.110
stealthchop_threshold: 7.0
